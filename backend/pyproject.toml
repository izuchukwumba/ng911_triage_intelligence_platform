[project]
name = "ntip"
version = "0.1.0"
description = "NG911 Triage Intelligence Platform — research backend (simulation only, not for live dispatch)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jsonschema>=4.23",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
  # NENA-STA-024 conveyance (WebSocket subscriber); also used by uvicorn.
  "websockets>=15",
]

[project.optional-dependencies]
# Learned baselines (B1). Not needed for the rules-only platform.
ml = [
  "scikit-learn>=1.5",
]
# B2: structured-output language model through the Anthropic API. Sends
# transcripts to an external service; opt-in only (see ntip.ml.b2).
llm = [
  "anthropic>=1.0",
]
dev = [
  "httpx2>=1.0",
  "hypothesis>=6.100",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-jsonschema",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Transcripts contain typographic apostrophes; matching them is intentional.
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
# A table of pinned sha256 digests; wrapping the hashes would not help.
"src/ntip/interop/eido/profile.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ntip"]

[[tool.mypy.overrides]]
# scikit-learn ships no type information.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
