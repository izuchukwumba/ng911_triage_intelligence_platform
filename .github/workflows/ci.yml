name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each PostgreSQL test creates and drops its own database here.
      NTIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (from lockfile)
        run: uv sync --locked --extra dev --extra ml --extra llm

      # NENA's EIDO schema is fetched from a pinned commit and verified by
      # sha256 (it is not vendored: the upstream repository has no licence).
      - name: Cache the pinned EIDO schema
        uses: actions/cache@v4
        with:
          path: ~/.cache/ntip/eido
          key: eido-${{ hashFiles('backend/src/ntip/interop/eido/profile.py') }}

      - name: Fetch and verify the pinned EIDO schema
        run: uv run python -m ntip.interop.eido.fetch

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Evaluate B0 on dev + regression
        run: uv run python -m ntip.evaluation --split dev --split regression

      - name: Safety gate (no critical under-triage on the regression split)
        run: uv run python -m ntip.evaluation --split regression --gate

      - name: Published contracts are current
        run: |
          uv run python -m ntip.schema.export --check
          uv run python -m ntip.api.openapi --check

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install (from lockfile)
        run: npm ci

      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

      - name: Type check and build
        run: npm run build

  stack:
    name: Container stack (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (B1 model, hybrid_review mode)
        env:
          NTIP_MODEL: b1-tfidf-logreg
          NTIP_INFERENCE_MODE: hybrid_review
        run: docker compose -f infra/docker/docker-compose.yml up --build --detach --wait

      - name: Ingest through the dashboard's API proxy and read it back
        run: |
          set -euo pipefail
          id=$(curl -fsS -X POST localhost:8080/v1/incidents                  -H 'Content-Type: application/json'                  -d '{"text":"My wife is not breathing. I do not know where I am.","synthetic":true}'                | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["advisory_priority"]=="P0", d; print(d["incident_id"])')
          curl -fsS "localhost:8000/v1/incidents/$id" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["state"]=="awaiting_review", d; i=d["incident"]["inference"]; assert i["status"]=="ok" and i["model_id"]=="b1-tfidf-logreg", i'
          curl -fsS "localhost:8000/v1/incidents/$id/model-outputs" | python3 -c 'import json,sys; [o]=json.load(sys.stdin); assert o["response"]["candidates"], o'
          curl -fsS localhost:8000/health/ready | grep -q '"event_store":true'

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs

      - name: Stop
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes

