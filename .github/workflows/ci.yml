name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each PostgreSQL test creates and drops its own database here.
      NTIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (from lockfile)
        run: uv sync --locked --extra dev --extra ml --extra llm

      # NENA's EIDO schema is fetched from a pinned commit and verified by
      # sha256 (it is not vendored: the upstream repository has no licence).
      - name: Cache the pinned NENA schemas
        uses: actions/cache@v4
        with:
          path: ~/.cache/ntip/eido
          key: nena-${{ hashFiles('backend/src/ntip/interop/eido/profile.py', 'backend/src/ntip/interop/conveyance/profile.py') }}

      - name: Fetch and verify the pinned NENA schemas
        run: uv run python -m ntip.interop.eido.fetch

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: |
          set -o pipefail
          uv run pytest | tee "$RUNNER_TEMP/pytest.txt"
          { echo "### Backend tests"; tail -n 1 "$RUNNER_TEMP/pytest.txt"; } >> "$GITHUB_STEP_SUMMARY"

      # The full report is attached to the run's summary (design v1.2, 14.2).
      - name: Evaluate B0 on dev + regression
        run: |
          set -o pipefail
          uv run python -m ntip.evaluation --split dev --split regression | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Safety gate (no critical under-triage on the regression split)
        run: uv run python -m ntip.evaluation --split regression --gate

      - name: Published contracts are current
        run: |
          uv run python -m ntip.schema.export --check
          uv run python -m ntip.schema.samples --check
          uv run python -m ntip.api.openapi --check

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install (from lockfile)
        run: npm ci

      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

      - name: Type check and build
        run: npm run build

  e2e:
    name: Dashboard end to end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend (from lockfile)
        working-directory: backend
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install the dashboard and a browser
        working-directory: apps/dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Starts an in-memory backend (authentication disabled, test machine
      # only) and the dashboard: the full operator workflow, then axe (WCAG
      # 2.1 A/AA) and keyboard checks on every screen.
      - name: End-to-end workflow, axe and keyboard checks
        working-directory: apps/dashboard
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7

  stack:
    name: Container stack (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (B1 model, hybrid_review mode)
        env:
          NTIP_MODEL: b1-tfidf-logreg
          NTIP_INFERENCE_MODE: hybrid_review
        run: docker compose -f infra/docker/docker-compose.yml up --build --detach --wait

      - name: Ingest through the dashboard's API proxy and read it back
        run: |
          set -euo pipefail
          # Unauthenticated requests are refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/incidents)" = 401
          AUTH='Authorization: Bearer dev-operator'
          id=$(curl -fsS -X POST localhost:8080/v1/incidents -H "$AUTH" \
                 -H 'Content-Type: application/json' \
                 -d '{"text":"My wife is not breathing. I do not know where I am.","synthetic":true}' \
               | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["advisory_priority"]=="P0", d; print(d["incident_id"])')
          curl -fsS -H "$AUTH" "localhost:8000/v1/incidents/$id" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["state"]=="awaiting_review", d; i=d["incident"]["inference"]; assert i["status"]=="ok" and i["model_id"]=="b1-tfidf-logreg", i'
          curl -fsS -H "$AUTH" "localhost:8000/v1/incidents/$id/model-outputs" | python3 -c 'import json,sys; [o]=json.load(sys.stdin); assert o["response"]["candidates"], o'
          curl -fsS localhost:8000/health/ready | grep -q '"event_store":true'
          # The mode is explicit on every response, and metrics need a token.
          curl -fsS -D - -o /dev/null localhost:8000/health/live | grep -qi '^x-ntip-mode: simulation'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/metrics)" = 401
          curl -fsS -H 'Authorization: Bearer dev-viewer' localhost:8000/metrics | grep -q 'ntip_assessments_total{inference="ok",status="completed"} 1'

      - name: The backend connects as the restricted database role
        run: |
          set -euo pipefail
          q() { docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -d ntip -tA "$@"; }
          others="datname = 'ntip' AND pid <> pg_backend_pid()"
          q -U ntip -c "SELECT usename, count(*) FROM pg_stat_activity WHERE $others GROUP BY 1"
          test "$(q -U ntip -c "SELECT count(*) FROM pg_stat_activity WHERE $others AND usename = 'ntip_api'")" -gt 0
          test "$(q -U ntip -c "SELECT count(*) FROM pg_stat_activity WHERE $others AND usename <> 'ntip_api'")" = 0
          # Refused by privileges, not only by the append-only triggers.
          out=$(q -U ntip_api -c "DELETE FROM audit_events" 2>&1 || true); echo "$out"
          grep -q "permission denied for table audit_events" <<<"$out"
          out=$(q -U ntip_api -c "ALTER TABLE audit_events DISABLE TRIGGER ALL" 2>&1 || true); echo "$out"
          grep -q "must be owner" <<<"$out"

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs

      - name: Stop
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes


  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history for secrets

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Python dependencies (pip-audit, locked versions)
        working-directory: backend
        run: |
          uv export --locked --format requirements-txt --extra ml --extra llm --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dashboard dependencies (npm audit)
        working-directory: apps/dashboard
        run: npm audit --audit-level=moderate

      - name: Secrets in the repository history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --config /repo/.gitleaks.toml --redact --verbose
