# Local research stack: PostgreSQL, migrations, backend API and dashboard.
# SIMULATION ONLY: synthetic data, no connection to any real emergency system.
#
#   docker compose -f infra/docker/docker-compose.yml up --build
#   # Stateless model service. The backend falls back to rules-only (and marks
  # results "degraded") whenever it is slow or unavailable.
  inference:
    build: ../../backend
    command: ["uvicorn", "ntip.ml.service:create_inference_app", "--factory",
              "--host", "0.0.0.0", "--port", "8100"]
    environment:
      NTIP_MODEL: ${NTIP_MODEL:-b0-rules-as-model}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      retries: 20

  dashboard: http://localhost:8080   API docs: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ntip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntip-dev-only}
      POSTGRES_DB: ntip
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntip"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ../../backend
    command: ["python", "-m", "ntip.store.migrate", "postgresql://ntip:${POSTGRES_PASSWORD:-ntip-dev-only}@postgres:5432/ntip"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ../../backend
    environment:
      NTIP_DATABASE_URL: postgresql://ntip:${POSTGRES_PASSWORD:-ntip-dev-only}@postgres:5432/ntip
      NTIP_CORS_ORIGINS: http://localhost:8080
      # rules_only (default) | ml_shadow | hybrid_review  (design v1.2, 3A.3)
      NTIP_INFERENCE_MODE: ${NTIP_INFERENCE_MODE:-rules_only}
      NTIP_INFERENCE_URL: http://inference:8100
      NTIP_INFERENCE_TIMEOUT_S: "2"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ../../apps/dashboard
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
