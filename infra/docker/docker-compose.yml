version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ng911
      POSTGRES_PASSWORD: ng911dev
      POSTGRES_DB: ng911
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ng911"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion-api:
    build:
      context: ../..
      dockerfile: services/ingestion-api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://ng911:ng911dev@postgres:5432/ng911
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
